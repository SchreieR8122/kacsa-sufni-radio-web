name: Daily fuel and toll prices

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Refresh public prices
        run: python3 scripts/update_prices.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No price-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Refresh daily fuel and toll prices"
          git push
